<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCFHS Nursing Technician Prometric Board Exam Simulator (120 Questions)</title>
    <style>
        :root {
            --primary-color: #004d40;
            --secondary-color: #00796b;
            --accent-color: #0288d1;
            --background-color: #f4f7f9;
            --card-background: #ffffff;
            --text-color: #2c3e50;
            --correct-color: #2e7d32;
            --incorrect-color: #c62828;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-background);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        header {
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .user-info-card {
            background-color: #e0f2f1;
            border: 1px solid #b2dfdb;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .timer-box {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--incorrect-color);
            background: #ffebee;
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid #ffcdd2;
        }

        .question-card {
            margin-bottom: 25px;
            padding: 22px;
            border: 1px solid #e0e0e0;
            border-radius: var(--border-radius);
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #1a252f;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            background: #f9f9f9;
            border: 1px solid #dddddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background-color: #e0f7fa;
            border-color: var(--secondary-color);
        }

        .option-label input {
            margin-right: 12px;
            margin-top: 4px;
        }

        .rationale-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            background-color: #e8f5e9;
            border-left: 5px solid var(--correct-color);
            font-size: 0.95rem;
        }

        .rationale-box.incorrect {
            background-color: #ffebee;
            border-left-color: var(--incorrect-color);
        }

        .distractor-analysis {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #444;
            border-top: 1px dashed #bbb;
            padding-top: 8px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #00332c;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
        }

        .btn-secondary:hover {
            background-color: #004d40;
        }

        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .left-controls {
            display: flex;
            gap: 10px;
        }

        .right-controls {
            display: flex;
            gap: 10px;
        }

        .results-panel {
            display: none;
            text-align: center;
            padding: 30px;
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            background-color: #ffffff;
            margin-bottom: 30px;
        }

        .assessment-badge {
            display: inline-block;
            font-size: 1.8rem;
            font-weight: 800;
            padding: 12px 30px;
            border-radius: 30px;
            margin: 15px 0;
            text-transform: uppercase;
        }

        .status-go {
            background-color: #c8e6c9;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }

        .status-not-go {
            background-color: #ffcdd2;
            color: #c62828;
            border: 2px solid #c62828;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 10px 0;
        }

        .candidate-summary {
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 15px;
            background: #f4f7f9;
            border-radius: 6px;
            text-align: left;
            display: inline-block;
            width: 80%;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            header { flex-direction: column; align-items: flex-start; }
            .candidate-summary { width: 100%; }
            .controls-container { flex-direction: column; align-items: stretch; }
            .left-controls, .right-controls { justify-content: space-between; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>SCFHS Licensing Examination Simulator</h1>
            <span class="badge">Saudi Commission for Health Specialties - Nursing Technician (120 High-Difficulty Vignettes)</span>
        </div>
        <div class="timer-box" id="timer">Time: 180:00</div>
    </header>

    <!-- Candidate Profile Section -->
    <div class="user-info-card" id="profile-section">
        <h3 style="margin-top:0; color: var(--primary-color);">Candidate Credentials</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
            <div class="form-group">
                <label for="candidate-name">Full Name (English):</label>
                <input type="text" id="candidate-name" placeholder="e.g., Abdullah Ahmed Al-Mansoor" required>
            </div>
            <div class="form-group">
                <label for="candidate-id">SCFHS Eligibility / Application ID:</label>
                <input type="text" id="candidate-id" placeholder="e.g., SCFHS-2026-883921" required>
            </div>
        </div>
        <button class="btn" style="margin-top: 10px;" onclick="initializeExam()">Start Official Assessment</button>
    </div>

    <!-- Exam Results Panel -->
    <div class="results-panel" id="results-panel">
        <h2>Official SCFHS Assessment Result</h2>
        <div class="candidate-summary" id="candidate-summary-output"></div>
        <div id="assessment-badge-container"></div>
        <div class="score-display" id="score-text">0%</div>
        <p id="pass-fail-details" style="font-size: 1.1rem;"></p>
        <button class="btn" onclick="location.reload()">Retake Assessment</button>
    </div>

    <!-- Questions Container -->
    <div id="quiz-container" style="display: none;">
        <!-- Single Question rendered here -->
    </div>

    <!-- Navigations & Controls -->
    <div class="controls-container" id="navigation-controls" style="display: none;">
        <div class="left-controls">
            <button class="btn btn-secondary" id="prev-btn" onclick="navigateQuestion(-1)">Previous</button>
            <button class="btn" id="next-btn" onclick="navigateQuestion(1)">Next</button>
        </div>
        <div class="right-controls">
            <button class="btn btn-secondary" id="rationale-btn" onclick="toggleRationale()">Show Rationale</button>
            <button class="btn" id="submit-btn" style="display: none; background-color: #c62828;" onclick="submitExam()">Finalize & Submit Exam</button>
        </div>
    </div>
</div>

<script>
    // Master Item Bank: 120 Advanced Prometric Vignettes
    const masterBank = [
        {
            id: 1,
            question: "A nursing technician is performing endotracheal suctioning for an intubated patient. During insertion of the suction catheter, the patient's heart rate suddenly drops from 82 bpm to 48 bpm on the bedside monitor. What is the nursing technician's FIRST immediate intervention?",
            options: [
                { text: "Withdraw the catheter completely and hyperoxygenate with 100% O2.", isCorrect: true },
                { text: "Advance the catheter 1 cm further and apply continuous suction.", isCorrect: false },
                { text: "Instill 5 mL of sterile 0.9% normal saline into the endotracheal tube.", isCorrect: false },
                { text: "Notify the registered nurse or physician immediately before stopping.", isCorrect: false }
            ],
            rationale: "Vagal stimulation during endotracheal catheter insertion causes acute bradycardia. The technician must immediately remove the stimulus (withdraw catheter) and provide hyperoxygenation to prevent cardiac arrest.",
            distractorAnalysis: "B: Applying suction worsens hypoxia and vagal tone. C: Saline instillation causes desaturation and infection risks, and does not resolve vagal response. D: Waiting to notify the nurse delays emergency immediate procedure termination."
        },
        {
            id: 2,
            question: "A nursing technician is measuring vital signs on a patient 2 hours post-thyroidectomy. The patient reports feeling 'a tingling sensation around the mouth and fingers.' Which physical assessment check should the technician perform immediately while alerting the staff nurse?",
            options: [
                { text: "Check for Kernig's sign by flexing the patient's thigh at the hip.", isCorrect: false },
                { text: "Inflate a blood pressure cuff on the upper arm to observe for Trousseau's sign.", isCorrect: true },
                { text: "Assess for Babinski reflex on the plantar surface of the foot.", isCorrect: false },
                { text: "Perform a rapid capillary blood glucose fingerstick check.", isCorrect: false }
            ],
            rationale: "Circumoral and digital paresthesia post-thyroidectomy indicates acute hypocalcemia due to accidental parathyroid tissue injury. Demonstrating Trousseau's sign (carpopedal spasm induced by BP cuff inflation above systolic level) confirms neuromuscular irritability.",
            distractorAnalysis: "A: Kernig's sign tests for meningeal irritation. C: Babinski reflex assesses upper motor neuron lesions. D: Hypoglycemia causes diaphoresis and tremors, not acute post-thyroidectomy carpopedal paresthesia."
        },
        {
            id: 3,
            question: "A nursing technician is preparing to change a transparent dressing over a patient's subclavian Central Venous Catheter (CVC). To maintain maximum aseptic technique and prevent air embolism during the procedure, how should the patient be positioned?",
            options: [
                { text: "High-Fowler's position with head turned toward the insertion site.", isCorrect: false },
                { text: "Prone position with head aligned neutrally with the spine.", isCorrect: false },
                { text: "Trendelenburg position with head turned away from the insertion site.", isCorrect: true },
                { text: "Left lateral recumbent position with feet elevated 30 degrees.", isCorrect: false }
            ],
            rationale: "Trendelenburg position increases central venous pressure in upper body veins, preventing air entry (air embolism) if lines disconnect, while turning the head away prevents site contamination from respiratory flora.",
            distractorAnalysis: "A: High-Fowler's lowers venous pressure in neck veins, increasing air embolism risk. B: Prone position impedes chest expansion and central line site access. D: Left lateral (Durant maneuver) is used AFTER air embolism occurs, not as routine dressing prep."
        },
        {
            id: 4,
            question: "While monitoring a patient receiving a continuous peripheral IV infusion of Potassium Chloride (20 mEq in 500 mL Normal Saline), the technician notes the insertion site is cool, pale, swollen, and the patient reports severe burning pain. What action must the technician take FIRST?",
            options: [
                { text: "Apply a hot compress directly over the site to reduce vascular spasm.", isCorrect: false },
                { text: "Slow the infusion rate to half and re-evaluate in 15 minutes.", isCorrect: false },
                { text: "Elevate the extremity above heart level and massage the tissue.", isCorrect: false },
                { text: "Stop the IV infusion immediately and disconnect the tubing.", isCorrect: true }
            ],
            rationale: "Coolness, swelling, pallor, and burning indicate IV extravasation/infiltration of a vesicant/irritant (Potassium Chloride). Immediate cessation of infusion prevents severe tissue necrosis.",
            distractorAnalysis: "A: Heat applied to an extravasated tissue without stopping infusion accelerates tissue necrosis. B: Continuing vesicant infusion at any rate causes tissue destruction. C: Massaging infiltrated vesicants spreads the toxic solution further into subcutaneous tissue."
        },
        {
            id: 5,
            question: "A nursing technician is inserting an indwelling Foley catheter in an adult male patient. After inserting the catheter 17 cm, dark yellow urine begins to flow into the tubing. What is the NEXT correct technical step before inflating the retention balloon?",
            options: [
                { text: "Advance the catheter another 2.5 to 5 cm (or up to the bifurcation Y-port).", isCorrect: true },
                { text: "Instill 10 mL of sterile water into the balloon port immediately.", isCorrect: false },
                { text: "Pull back gently on the catheter until resistance is met.", isCorrect: false },
                { text: "Attach the drainage bag to the bedside rail above bladder level.", isCorrect: false }
            ],
            rationale: "In male catheterization, urine appearance occurs when the tip enters the prostatic urethra/bladder neck. Advancing further to the bifurcation ensures the balloon rests inside the bladder cavity before inflation, preventing urethral rupture.",
            distractorAnalysis: "B: Inflating the balloon immediately upon urine appearance can rupture the male urethra if the balloon is still in the prostatic catheter tract. C: Pulling back is done AFTER inflation. D: Drainage bags must stay BELOW bladder level to prevent backflow infection."
        },
        {
            id: 6,
            question: "A nursing technician is assisting with a patient undergoing a lumbar puncture. Following completion of the procedure, which post-procedural position is most critical for the technician to maintain for the patient to prevent post-dural puncture headache?",
            options: [
                { text: "Reverse Trendelenburg position for 2 hours.", isCorrect: false },
                { text: "Supine flat position (prone or flat) for 4 to 8 hours.", isCorrect: true },
                { text: "Semi-Fowler's position with knees flexed 45 degrees.", isCorrect: false },
                { text: "High-Fowler's position with neck hyperextended.", isCorrect: false }
            ],
            rationale: "Remaining flat supine post-lumbar puncture decreases CSF leakage from the dural puncture site, significantly reducing the incidence of severe low-pressure post-lumbar headache.",
            distractorAnalysis: "A, C, & D: Any head elevation (Semi-Fowler's, High-Fowler's, Reverse Trendelenburg) increases spinal fluid gravity pressure gradient, worsening CSF leak and causing severe intracranial traction headache."
        },
        {
            id: 7,
            question: "A nursing technician is obtaining an automated blood pressure reading on a patient post-mastectomy with lymph node dissection of the left arm. The patient has a right-arm arteriovenous (AV) fistula for dialysis. Where should the technician measure the blood pressure?",
            options: [
                { text: "Left upper arm using a manual wrist cuff.", isCorrect: false },
                { text: "Right upper arm proximal to the AV fistula graft.", isCorrect: false },
                { text: "Lower extremity over the popliteal artery/thigh or ankle.", isCorrect: true },
                { text: "Right forearm distal to the vascular anastomosis site.", isCorrect: false }
            ],
            rationale: "BP cuffs are strictly contraindicated on arms with lymph node dissection (risk of severe lymphedema) and arms with AV fistulas (risk of thrombosis/graft failure). Lower extremity (thigh/calf) must be used.",
            distractorAnalysis: "A: Mastectomy side must be avoided due to lymphedema risk. B & D: Any cuff pressure on an arm with an active AV fistula obstructs vascular access flow and risks permanent clotting."
        },
        {
            id: 8,
            question: "A technician is caring for a patient on contact and droplet isolation for suspected C. difficile infection and Influenza. When leaving the isolation room, in which precise order should the technician remove personal protective equipment (PPE)?",
            options: [
                { text: "Mask/Respirator -> Gown -> Eye Protection -> Gloves.", isCorrect: false },
                { text: "Gown -> Mask/Respirator -> Eye Protection -> Gloves.", isCorrect: false },
                { text: "Eye Protection -> Gown -> Mask/Respirator -> Gloves.", isCorrect: false },
                { text: "Gloves -> Goggles/Face Shield -> Gown -> Mask/Respirator.", isCorrect: true }
            ],
            rationale: "The standard CDC doffing sequence from most contaminated to least contaminated is: Gloves, Goggles/Face Shield, Gown, and lastly Mask/Respirator (removed outside the room for airborne/droplet safety).",
            distractorAnalysis: "A, B, & C: Gloves are the most contaminated PPE item and must be removed first to prevent contaminating surrounding clothes, face, or respiratory gear during doffing."
        },
        {
            id: 9,
            question: "A nursing technician is obtaining a 12-lead Electrocardiogram (ECG) for a chest pain patient. Where should the technician correctly place electrode V4?",
            options: [
                { text: "5th intercostal space at the left midclavicular line.", isCorrect: true },
                { text: "4th intercostal space at the right sternal border.", isCorrect: false },
                { text: "4th intercostal space at the left sternal border.", isCorrect: false },
                { text: "5th intercostal space at the left anterior axillary line.", isCorrect: false }
            ],
            rationale: "Anatomical precision in 12-lead ECG placement is critical. Lead V4 is placed specifically at the 5th intercostal space in the midclavicular line. Misplacement leads to false ST-segment elevation or depression readings.",
            distractorAnalysis: "B: Location for lead V1. C: Location for lead V2. D: Location for lead V5 (V6 is midaxillary)."
        },
        {
            id: 10,
            question: "A nursing technician is caring for a patient who returned from a cardiac catheterization via the right femoral artery 1 hour ago. During routine vitals, the technician notes the right pedal pulse is absent and the right foot is cold and pale. What is the technician's FIRST immediate action?",
            options: [
                { text: "Re-assess the right pedal pulse using a Doppler ultrasound device.", isCorrect: true },
                { text: "Elevate the right leg on two pillows to enhance venous return.", isCorrect: false },
                { text: "Flex the patient's right hip and knee to relieve vascular pressure.", isCorrect: false },
                { text: "Apply a warm thermal blanket directly over the cold extremity.", isCorrect: false }
            ],
            rationale: "Loss of a distal pulse post-femoral catheterization suggests arterial occlusion/thrombosis. The immediate technical verification step is confirming vascular flow with a Doppler device while immediately alerting the RN.",
            distractorAnalysis: "B: Elevating the leg worsens arterial ischemia. C: Bending the hip is strictly prohibited after femoral sheath removal to prevent massive hemorrhage. D: Applying external heat increases tissue metabolic demand in an ischemic limb, accelerating necrosis."
        },
        {
            id: 11,
            question: "A nursing technician is performing a manual blood pressure measurement. If the technician uses a blood pressure cuff that is too narrow for an obese patient's arm, how will this affect the blood pressure reading?",
            options: [
                { text: "Falsely elevated (high) systolic and diastolic readings.", isCorrect: true },
                { text: "Falsely lowered (low) systolic and diastolic readings.", isCorrect: false },
                { text: "Falsely low systolic with an elevated diastolic reading.", isCorrect: false },
                { text: "Accurate systolic reading with an unmeasurable diastolic reading.", isCorrect: false }
            ],
            rationale: "Using a cuff bladder that is too narrow or small relative to the arm circumference requires higher inflation pressures to occlude the artery, resulting in a falsely high blood pressure reading.",
            distractorAnalysis: "B: An oversized or overly wide cuff results in falsely low blood pressure readings. C & D: Bladder size affects overall pressure transmission uniformly, altering both systolic and diastolic values upwards."
        },
        {
            id: 12,
            question: "While caring for a patient receiving a blood transfusion, 10 minutes into the infusion, the patient complains of lower back pain, chills, and shortness of breath. What is the technician's FIRST action?",
            options: [
                { text: "Stop the blood infusion immediately and flush the line with normal saline.", isCorrect: false },
                { text: "Stop the blood infusion immediately and notify the nurse.", isCorrect: true },
                { text: "Slow the infusion rate to KVO (Keep Vein Open) and check vital signs.", isCorrect: false },
                { text: "Administer STAT IV diphenhydramine per unit protocol.", isCorrect: false }
            ],
            rationale: "Flank/back pain, chills, and dyspnea indicate an acute hemolytic transfusion reaction. The primary safety role of the technician is to immediately stop the blood flow to prevent further fatal antigen-antibody exposure and summon the nurse.",
            distractorAnalysis: "A: Flushing the remaining blood inside the IV tubing into the patient introduces more fatal allergen/mismatched blood. C: Never continue or slow a blood line during a reaction. D: Administering IV medications is outside the nursing technician scope."
        },
        {
            id: 13,
            question: "A nursing technician is performing tracheostomy care for a stable patient. When replacing the dirty tracheostomy ties (holder), how should the technician secure the new ties to prevent accidental decannulation?",
            options: [
                { text: "Secure the new ties before removing the old ties.", isCorrect: true },
                { text: "Remove the old ties first, clean the stoma, then tie the new ones.", isCorrect: false },
                { text: "Tie the new holder tightly allowing no finger space beneath the strap.", isCorrect: false },
                { text: "Cut the old ties while an assistant holds the face mask in place.", isCorrect: false }
            ],
            rationale: "To prevent accidental tube dislodgement or airway loss during tie changes, the new tracheostomy ties/holder MUST be applied and secured BEFORE cutting and removing the old ties.",
            distractorAnalysis: "B: Removing old ties first risks coughing out the tracheostomy tube. C: Ties should allow 1 to 2 fingers to fit comfortably. D: Face mask does not secure an artificial airway."
        },
        {
            id: 14,
            question: "A technician is preparing to collect a 24-hour urine collection specimen for a patient evaluated for Pheochromocytoma. How should the technician handle the collection process at the start of the 24-hour period?",
            options: [
                { text: "Discard the first morning voided specimen and record the start time.", isCorrect: true },
                { text: "Include the first morning void in the container and start the timer.", isCorrect: false },
                { text: "Keep the urine collection container at room temperature near the bed.", isCorrect: false },
                { text: "Save only the midstream portion of each void throughout the day.", isCorrect: false }
            ],
            rationale: "A 24-hour urine collection begins with an empty bladder. The first morning void is discarded, the time is noted, and all subsequent urine for 24 hours is saved in a refrigerated container.",
            distractorAnalysis: "B: Including initial morning void skews test results with old urine. C: Containers must be kept on ice or refrigerated. D: All voided urine (total volume) must be collected."
        },
        {
            id: 15,
            question: "A technician is assisting with a patient who suddenly suffers a tonic-clonic seizure in bed. What is the safest position to place the patient during the active seizure phase?",
            options: [
                { text: "Side-lying (lateral) position with head tilted slightly forward.", isCorrect: true },
                { text: "High-Fowler's position with a soft pillow under the head.", isCorrect: false },
                { text: "Supine position with a tongue depressor inserted between teeth.", isCorrect: false },
                { text: "Trendelenburg position with side rails down.", isCorrect: false }
            ],
            rationale: "Placing a seizing patient in a side-lying position allows secretions to drain out of the mouth, preventing airway obstruction and aspiration.",
            distractorAnalysis: "B: High-Fowler's is impossible to maintain and risks falls. C: Inserting objects into a seizing patient's mouth causes severe trauma or airway occlusion. D: Lowering side rails risks falls."
        },
        {
            id: 16,
            question: "A nursing technician is inserting a nasogastric (NG) tube. To facilitate the entry of the tube into the esophagus rather than the larynx, how should the patient be instructed to position their head once the tube reaches the nasopharynx?",
            options: [
                { text: "Flex the head forward (chin-to-chest) and swallow water.", isCorrect: true },
                { text: "Tilt the head backward (hyperextend) and take deep breaths.", isCorrect: false },
                { text: "Keep the head in a neutral midline position and hold breath.", isCorrect: false },
                { text: "Turn the head forcefully to the left shoulder and cough.", isCorrect: false }
            ],
            rationale: "Flexing the neck (chin-to-chest) closes the trachea/glottis and opens the esophagus. Sips of water facilitate smooth passage into the stomach.",
            distractorAnalysis: "B: Hyperextending the neck opens the trachea, increasing the risk of tube entry into the airway. C & D: Do not close the epiglottis effectively."
        },
        {
            id: 17,
            question: "A nursing technician is obtaining a blood sample via venipuncture. What is the maximum recommended time a tourniquet should remain applied to a patient's arm during venipuncture to avoid hemoconcentration?",
            options: [
                { text: "1 minute (60 seconds).", isCorrect: true },
                { text: "3 minutes.", isCorrect: false },
                { text: "5 minutes.", isCorrect: false },
                { text: "Until all blood tubes are completely filled.", isCorrect: false }
            ],
            rationale: "Leaving a tourniquet on longer than 1 minute causes hemoconcentration (falsely elevated potassium, protein, and cell counts) and localized ischemia.",
            distractorAnalysis: "B, C, & D: Exceeding 60 seconds severely compromises specimen integrity."
        },
        {
            id: 18,
            question: "A nursing technician is ambulating a hemiplegic patient post-stroke who has left-sided weakness. Where should the technician stand when using a gait belt to support the patient during ambulation?",
            options: [
                { text: "On the patient's weaker (left) side and slightly behind.", isCorrect: true },
                { text: "On the patient's stronger (right) side and slightly ahead.", isCorrect: false },
                { text: "Directly in front of the patient holding both hands.", isCorrect: false },
                { text: "Directly behind the patient holding the shoulders.", isCorrect: false }
            ],
            rationale: "The technician stands on the affected/weaker side and slightly behind to provide immediate support if the weak leg buckles.",
            distractorAnalysis: "B: Standing on the strong side leaves the weak side unsupported. C & D: Create fall risks and poor body mechanics."
        },

    // Helper to shuffle array in-place (Fisher-Yates)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Process questions: Deep clone and randomize options for equal A, B, C, D distribution
    let processedQuestions = masterBank.map((q) => {
        let clonedOptions = JSON.parse(JSON.stringify(q.options));
        shuffleArray(clonedOptions);
        return {
            id: q.id,
            question: q.question,
            options: clonedOptions,
            rationale: q.rationale,
            distractorAnalysis: q.distractorAnalysis
        };
    });

    let currentQuestionIndex = 0;
    let userAnswers = {};
    let timerInterval = null;
    let timeRemaining = 180 * 60; // 180 minutes for 120 questions

    function initializeExam() {
        const nameInput = document.getElementById('candidate-name').value.trim();
        const idInput = document.getElementById('candidate-id').value.trim();

        if (!nameInput || !idInput) {
            alert("Please enter both Candidate Full Name and SCFHS Application ID to proceed.");
            return;
        }

        document.getElementById('profile-section').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('navigation-controls').style.display = 'flex';

        startTimer();
        renderQuestion(currentQuestionIndex);
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;
            document.getElementById('timer').innerText = `Time: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("Time has expired! Submitting assessment automatically.");
                submitExam();
            }
        }, 1000);
    }

    function renderQuestion(index) {
        const q = processedQuestions[index];
        const container = document.getElementById('quiz-container');
        
        let selectedOptionIndex = userAnswers[index];

        let html = `
            <div class="question-card">
                <div class="question-title">Question ${index + 1} of ${processedQuestions.length}: ${q.question}</div>
                <ul class="options-list">
        `;

        q.options.forEach((opt, optIdx) => {
            let isChecked = selectedOptionIndex === optIdx ? 'checked' : '';
            html += `
                <li class="option-item">
                    <label class="option-label">
                        <input type="radio" name="question-${index}" value="${optIdx}" ${isChecked} onchange="selectOption(${index}, ${optIdx})">
                        <span><strong>${String.fromCharCode(65 + optIdx)}:</strong> ${opt.text}</span>
                    </label>
                </li>
            `;
        });

        html += `
                </ul>
                <div class="rationale-box" id="rationale-box-${index}">
                    <strong>Clinical Rationale:</strong><br>${q.rationale}<br>
                    <div class="distractor-analysis">
                        <strong>Distractor Analysis:</strong><br>${q.distractorAnalysis}
                    </div>
                </div>
            </div>
        `;

        container.innerHTML = html;

        // Button states
        document.getElementById('prev-btn').disabled = index === 0;
        if (index === processedQuestions.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'inline-block';
        } else {
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('submit-btn').style.display = 'none';
        }
    }

    function selectOption(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
    }

    function navigateQuestion(direction) {
        currentQuestionIndex += direction;
        if (currentQuestionIndex < 0) currentQuestionIndex = 0;
        if (currentQuestionIndex >= processedQuestions.length) currentQuestionIndex = processedQuestions.length - 1;
        renderQuestion(currentQuestionIndex);
    }

    function toggleRationale() {
        const box = document.getElementById(`rationale-box-${currentQuestionIndex}`);
        if (box) {
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
            }
        }
    }

    function submitExam() {
        clearInterval(timerInterval);

        let correctCount = 0;
        processedQuestions.forEach((q, idx) => {
            let userAns = userAnswers[idx];
            if (userAns !== undefined && q.options[userAns].isCorrect) {
                correctCount++;
            }
        });

        let percentage = Math.round((correctCount / processedQuestions.length) * 100);
        let name = document.getElementById('candidate-name').value.trim();
        let candidateId = document.getElementById('candidate-id').value.trim();

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('navigation-controls').style.display = 'none';
        document.getElementById('results-panel').style.display = 'block';

        document.getElementById('candidate-summary-output').innerHTML = `
            <strong>Candidate Name:</strong> ${name}<br>
            <strong>SCFHS Eligibility ID:</strong> ${candidateId}<br>
            <strong>Total Questions Attempted:</strong> ${Object.keys(userAnswers).length} of ${processedQuestions.length}<br>
            <strong>Correct Answers:</strong> ${correctCount} / ${processedQuestions.length}
        `;

        document.getElementById('score-text').innerText = `${percentage}%`;

        const badgeContainer = document.getElementById('assessment-badge-container');
        const detailsText = document.getElementById('pass-fail-details');

        if (percentage >= 60) {
            badgeContainer.innerHTML = `<span class="assessment-badge status-go">STATUS: PASS (READY FOR PROMETRIC BOARD)</span>`;
            detailsText.innerHTML = `Congratulations! You have demonstrated clinical competence corresponding to Saudi Commission for Health Specialties (SCFHS) nursing standards.`;
            detailsText.style.color = `var(--correct-color)`;
        } else {
            badgeContainer.innerHTML = `<span class="assessment-badge status-not-go">STATUS: FAIL (NEEDS FURTHER PREPARATION)</span>`;
            detailsText.innerHTML = `The passing score threshold for SCFHS Licensing Examination is 60%. Please review clinical rationales and distractor analyses carefully.`;
            detailsText.style.color = `var(--incorrect-color)`;
        }
    }
</script>
